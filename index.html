    :root { color-scheme: light dark; }

    .layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .sidebar { border-right: 1px solid #ddd; padding: 16px; position: sticky; top: 0; max-height: 100vh; overflow: auto; }

    .sidebar p { font-size: 12px; color: #666; margin: 0 0 12px; }

    .nav button { text-align: left; border: 1px solid #ddd; background: transparent; border-radius: 8px; padding: 8px; cursor: pointer; }

    .main { padding: 20px; }
    .page-header { margin-bottom: 12px; }
    .page-header h2 { margin: 0; }
    .meta { font-size: 12px; color: #666; }
    .refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font-size: 11px; border: 1px solid #ddd; border-radius: 999px; padding: 3px 8px; }
    .section { margin-top: 16px; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }
    .section h3 { margin: 0; padding: 10px 12px; border-bottom: 1px solid #ddd; font-size: 14px; }
    .row { display: grid; grid-template-columns: minmax(260px, 1.5fr) minmax(150px, .9fr) 130px 86px; gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid #eee; }

    .token { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .value { font-size: 12px; color: #666; }
    .sample { height: 28px; border-radius: 6px; border: 1px solid #ccc; background: #f3f3f3; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .sample.text { border: 0; background: transparent; justify-content: flex-start; }
    .copy-btn { height: 28px; border: 1px solid #ddd; border-radius: 6px; background: transparent; font-size: 12px; cursor: pointer; }
    .copy-btn:hover { border-color: #ed1c24; }
    .icon-glyph { width: 18px; height: 18px; border-radius: 4px; border: 2px solid currentColor; position: relative; }
    .icon-glyph:after { content: ""; position: absolute; width: 6px; height: 2px; background: currentColor; left: 4px; top: 7px; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; max-height: none; border-right: 0; border-bottom: 1px solid #ddd; }

    function category(token) {
      if (token.includes("--sds-color-background-")) return "Color / Background";
      if (token.includes("--sds-color-border-")) return "Color / Border";
      if (token.includes("--sds-color-icon-")) return "Color / Icon";
      if (token.includes("--sds-color-text-")) return "Color / Text";
      if (token.includes("--sds-color-")) return "Color / Misc";
      if (token.includes("--sds-size-space-")) return "Size / Space";
      if (token.includes("--sds-size-radius-")) return "Size / Radius";
      if (token.includes("--sds-size-stroke-")) return "Size / Stroke";
      if (token.includes("--sds-typography-family-")) return "Typography / Family";
      if (token.includes("--sds-typography-scale-")) return "Typography / Scale";
      if (token.includes("--sds-typography-weight-")) return "Typography / Weight";
      if (token.includes("--sds-effect-")) return "Effects";
      return "Other";
    }

    function inferColor(token) {
      const value = TOKEN_VALUES[token];
      if (typeof value === "string" && value.startsWith("rgb")) return value;
      let h = 0;
      for (let i = 0; i < token.length; i += 1) h = token.charCodeAt(i) + ((h << 5) - h);
      return `hsl(${Math.abs(h) % 360} 65% 55%)`;
    }

        box.innerHTML = `<span class="icon-glyph" aria-hidden="true"></span>`;
      } else if (cat === "Color / Text") {
        box.className = "sample text";
        box.style.color = inferColor(token);
        box.innerHTML = `<span style="font-weight:600">Sample Text</span>`;

        box.style.background = "#fff";
        box.innerHTML = `<div style="width:72px;height:16px;border:2px solid ${inferColor(token)};border-radius:5px"></div>`;
      } else if (cat.startsWith("Color")) {
        box.style.background = inferColor(token);
        box.textContent = "";
      } else if (cat === "Size / Space") {
        const px = typeof value === "number" ? Math.max(Math.abs(value), 2) : 8;
        box.innerHTML = `<div style="height:10px;width:${Math.min(px*6,100)}px;background:#ed1c24;border-radius:3px"></div>`;
      } else if (cat === "Size / Radius") {
        const r = typeof value === "number" ? Math.min(value, 20) : 6;
        box.innerHTML = `<div style="width:70px;height:20px;background:#2c2c2e;border-radius:${r}px"></div>`;
      } else if (cat.startsWith("Typography")) {
        box.className = "sample text";
        const size = token.includes("scale-") && typeof value === "number" ? value : 13;
        box.innerHTML = `<span style="font-size:${Math.max(10, Math.min(size, 24))}px">Aa</span>`;
      } else if (cat === "Effects") {
        box.innerHTML = `<div style="width:70px;height:16px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)"></div>`;

        box.textContent = "Preview";
      }
      return box;
    }

    function renderPage(name, tokens) {
      document.getElementById("pageTitle").textContent = name;
      const nodeIdForUrl = PAGE_CONFIG.find(p => p.name === name)?.pageId || "";
      const nodeParam = nodeIdForUrl.replace(":", "-");
      document.getElementById("pageMeta").innerHTML = `${tokens.length} tokens mapped to this section · <a href="https://www.figma.com/design/5n6UEqcMPdT2cx3pIURqGf/HR-App---DS--V1?node-id=${nodeParam}" target="_blank" rel="noreferrer">Open Figma section</a>`;
      const refs = PAGE_CONFIG.find(p => p.name === name)?.refs || [];
      const refsRoot = document.getElementById("pageRefs");
      refsRoot.innerHTML = "";
      refs.forEach(r => {
        const el = document.createElement("span");
        el.className = "chip";
        el.textContent = r;
        refsRoot.appendChild(el);
      });

      const grouped = {};
      tokens.forEach(t => {
        const c = category(t);
        if (!grouped[c]) grouped[c] = [];
        grouped[c].push(t);
      });

      const content = document.getElementById("content");
      content.innerHTML = "";
      Object.entries(grouped).forEach(([cat, list]) => {
        const sec = document.createElement("section");
        sec.className = "section";
        sec.innerHTML = `<h3>${cat} (${list.length})</h3>`;
        list.sort().forEach(token => {
          const row = document.createElement("div");
          row.className = "row";
          const val = TOKEN_VALUES[token] !== undefined ? String(TOKEN_VALUES[token]) : "alias";
          row.innerHTML = `<div class="token">${token}</div><div class="value">${val}</div>`;
          row.appendChild(sampleFor(token));
          const copy = document.createElement("button");
          copy.className = "copy-btn";
          copy.textContent = "Copy";
          copy.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(token);
              copy.textContent = "Copied";
              setTimeout(() => { copy.textContent = "Copy"; }, 900);
            } catch (_) {
              copy.textContent = "Failed";
              setTimeout(() => { copy.textContent = "Copy"; }, 900);
            }
          });
          row.appendChild(copy);
          sec.appendChild(row);
        });
        content.appendChild(sec);
      });
    }

    const nav = document.getElementById("nav");
    PAGE_CONFIG.forEach((page, idx) => {
      const btn = document.createElement("button");
      btn.textContent = `${page.name} (${page.tokenIdx.length})`;
      const pageTokens = page.tokenIdx.map(i => TOKEN_LIST[i]).filter(Boolean);
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderPage(page.name, pageTokens);
        location.hash = encodeURIComponent(page.name);
      });
      if (idx === 0) btn.classList.add("active");
      nav.appendChild(btn);
    });

    const initial = decodeURIComponent((location.hash || "").replace(/^#/, "")) || PAGE_CONFIG[0].name;
    const target = Array.from(nav.querySelectorAll("button")).find(b => b.textContent.startsWith(initial)) || nav.querySelector("button");
    target.click();
  </script>
</body>
</html>
