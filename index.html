<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figma Token Handover Preview</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: Inter, Arial, sans-serif; margin: 24px; line-height: 1.4; }
    h1 { margin: 0 0 6px; }
    .meta { color: #666; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; background: color-mix(in srgb, canvas 96%, #fff 4%); }
    .card h2 { margin: 0 0 8px; font-size: 16px; }
    .count { font-size: 12px; color: #666; margin-bottom: 10px; }
    ul { margin: 0; padding-left: 18px; max-height: 420px; overflow: auto; }
    li { margin: 3px 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .error { color: #b00020; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Figma Dev Handover: New Token Names</h1>
  <div class="meta">Grouped HTML preview generated from <code>figma-dev-handover-new-tokens.md</code></div>
  <div id="status" class="meta">Loading token list...</div>
  <div id="root" class="grid"></div>

  <script>
    const groups = {
      "Color / Background": [],
      "Color / Border": [],
      "Color / Icon": [],
      "Color / Text": [],
      "Color / Misc": [],
      "Size / Space": [],
      "Size / Radius": [],
      "Size / Stroke": [],
      "Typography / Family": [],
      "Typography / Scale": [],
      "Typography / Weight": [],
      "Effects": [],
      "Other": []
    };

    function groupToken(t) {
      if (t.includes("--sds-color-background-")) return "Color / Background";
      if (t.includes("--sds-color-border-")) return "Color / Border";
      if (t.includes("--sds-color-icon-")) return "Color / Icon";
      if (t.includes("--sds-color-text-")) return "Color / Text";
      if (t.includes("--sds-color-")) return "Color / Misc";
      if (t.includes("--sds-size-space-")) return "Size / Space";
      if (t.includes("--sds-size-radius-")) return "Size / Radius";
      if (t.includes("--sds-size-stroke-")) return "Size / Stroke";
      if (t.includes("--sds-typography-family-")) return "Typography / Family";
      if (t.includes("--sds-typography-scale-")) return "Typography / Scale";
      if (t.includes("--sds-typography-weight-")) return "Typography / Weight";
      if (t.includes("--sds-effect-")) return "Effects";
      return "Other";
    }

    function render(tokens) {
      Object.keys(groups).forEach(k => groups[k] = []);
      tokens.forEach(t => groups[groupToken(t)].push(t));

      const root = document.getElementById("root");
      root.innerHTML = "";
      Object.entries(groups).forEach(([name, list]) => {
        if (!list.length) return;
        list.sort();
        const card = document.createElement("section");
        card.className = "card";
        card.innerHTML = `<h2>${name}</h2><div class="count">${list.length} tokens</div>`;
        const ul = document.createElement("ul");
        list.forEach(token => {
          const li = document.createElement("li");
          li.textContent = token;
          ul.appendChild(li);
        });
        card.appendChild(ul);
        root.appendChild(card);
      });
      document.getElementById("status").textContent = `Loaded ${tokens.length} tokens`;
    }

    fetch("./figma-dev-handover-new-tokens.md")
      .then(r => r.text())
      .then(md => {
        const normalized = md.replace(/\u0000/g, "");
        const tokens = normalized
          .split(/\r?\n/)
          .map(line => line.trim())
          .filter(line => line.startsWith("- `var(--sds-"))
          .map(line => line.replace(/^- `|`$/g, ""));
        render(tokens);
      })
      .catch(() => {
        const status = document.getElementById("status");
        status.className = "meta error";
        status.textContent = "Failed to load token markdown file.";
      });
  </script>
</body>
</html>
